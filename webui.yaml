---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webui
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: webui
spec:
  type: ClusterIP
  selector:
    app: webui
  ports:
    - protocol: TCP
      # port of the service
      port: 8082
      # port of the pod
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
spec:
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
        - name: webui
          image: dockercoins/webui:v0.1
          # resources:
          #   limits:
          #     memory: '128Mi'
          #     cpu: '500m'
          ports:
            - containerPort: 80
