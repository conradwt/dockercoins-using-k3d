---
apiVersion: v1
kind: Service
metadata:
  name: hasher
spec:
  type: ClusterIP
  selector:
    app: hasher
  ports:
    - protocol: TCP
      # port of the service
      port: 80
      # port of the pod
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hasher
spec:
  selector:
    matchLabels:
      app: hasher
  template:
    metadata:
      labels:
        app: hasher
    spec:
      containers:
        - name: hasher
          image: dockercoins/hasher:v0.1

          # Because if limits = requests then QoS is set to "Guaranteed"
          resources:
            requests:
              cpu: '25m' # Request 25 MiB of memory
              memory: '40Mi' # Request 40 MiB of memory
            limits:
              cpu: '50m' # Limit to 50 millicores of cpu
              memory: '80Mi' # Limit to 80 MiB of memory

          # per-container security context
          # lock down privileges inside the container
          securityContext:
            allowPrivilegeEscalation: false # prevent sudo, etc.
            privileged: false               # prevent acting like host root

          # hardcode the listening port if Dockerfile isn't set with EXPOSE
          ports:
            - containerPort: 80
              protocol: TCP
